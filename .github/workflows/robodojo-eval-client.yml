# Start the RoboDojo evaluation client (simulator container) on a self-hosted GPU
# runner, DETACHED, against an external policy server (e.g. Pi_05), then finish.
# - If a client container for the task is already running, print its info and finish.
# - Assets, the client image, and submodule mirrors are cached on the runner and
#   reused; nothing is downloaded/built again when it is already there.
# The policy server is NOT started by this workflow. Runner setup: docs/CI_EVAL.md
name: RoboDojo eval client

on:
  workflow_dispatch:
    inputs:
      policy_name:
        description: "Policy directory under XPolicyLab/policy/"
        type: string
        default: Pi_05
      policy_host:
        description: "Policy server IP/hostname as seen from the runner (127.0.0.1 = same machine as the runner)"
        type: string
        default: 127.0.0.1
      policy_port:
        description: "Policy server port (the --policy-port given to robodojo.sh server)"
        type: string
        default: "9999"
      ckpt:
        description: "Checkpoint label recorded in result paths"
        type: string
        default: external
      tasks:
        description: "Comma-separated tasks (empty = use dimension)"
        type: string
        default: stack_bowls
      dimension:
        description: "Capability dimension(s) when tasks is empty (e.g. memory, all)"
        type: string
        default: ""
      eval_num:
        description: "Episodes per task (integer or 'native')"
        type: string
        default: "1"
      action_type:
        description: "Policy action type (must match the checkpoint)"
        type: choice
        options: [ee, joint]
        default: ee
      seed:
        description: "Eval / layout seed"
        type: string
        default: "0"
      rebuild_image:
        description: "Force docker build of the client image (otherwise reuse cached image)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      policy_name: { type: string, default: Pi_05 }
      policy_host: { type: string, default: 127.0.0.1 }
      policy_port: { type: string, default: "9999" }
      ckpt: { type: string, default: external }
      tasks: { type: string, default: stack_bowls }
      dimension: { type: string, default: "" }
      eval_num: { type: string, default: "1" }
      action_type: { type: string, default: ee }
      env_cfg: { type: string, default: "" }
      seed: { type: string, default: "0" }
      env_gpu: { type: string, default: "" }
      image_tag: { type: string, default: "" }
      rebuild_image: { type: boolean, default: false }
    outputs:
      tasks:
        description: "JSON array of tasks whose client was started (or already running)"
        value: ${{ jobs.start-client.outputs.tasks }}

permissions:
  contents: read

# Serialize start requests so two runs never start duplicate clients.
concurrency:
  group: robodojo-gpu-eval
  cancel-in-progress: false

env:
  # Inputs are passed through env, never interpolated into scripts.
  INPUT_POLICY_NAME: ${{ inputs.policy_name }}
  INPUT_POLICY_HOST: ${{ inputs.policy_host }}
  INPUT_POLICY_PORT: ${{ inputs.policy_port }}
  INPUT_CKPT: ${{ inputs.ckpt }}
  INPUT_TASKS: ${{ inputs.tasks }}
  INPUT_DIMENSION: ${{ inputs.dimension }}
  INPUT_EVAL_NUM: ${{ inputs.eval_num }}
  INPUT_ACTION_TYPE: ${{ inputs.action_type }}
  # workflow_dispatch is limited to 10 inputs, so env_cfg / env_gpu / image_tag come from
  # workflow_call inputs, then repository variables, then defaults.
  INPUT_ENV_CFG: ${{ inputs.env_cfg || vars.ROBODOJO_ENV_CFG || 'arx_x5' }}
  INPUT_SEED: ${{ inputs.seed }}
  INPUT_ENV_GPU: ${{ inputs.env_gpu || vars.ROBODOJO_ENV_GPU || '0' }}
  INPUT_IMAGE_TAG: ${{ inputs.image_tag || vars.ROBODOJO_IMAGE_TAG || 'cuda12.8' }}
  # Runner-specific paths, configured as repository/organization variables.
  ROBODOJO_ASSETS_DIR: ${{ vars.ROBODOJO_ASSETS_DIR }}
  ROBODOJO_ASSETS_BAKED_DIR: ${{ vars.ROBODOJO_ASSETS_BAKED_DIR }}
  ROBODOJO_CACHE_DIR: ${{ vars.ROBODOJO_CACHE_DIR }}
  ROBODOJO_IMAGE_TAG: ${{ inputs.image_tag || vars.ROBODOJO_IMAGE_TAG || 'cuda12.8' }}
  # Optional: base-image / mirror overrides for runners without direct Docker Hub access.
  ROBODOJO_CUDA_CHECK_IMAGE: ${{ vars.ROBODOJO_CUDA_CHECK_IMAGE }}
  ROBODOJO_BUILD_ARGS: ${{ vars.ROBODOJO_BUILD_ARGS }}
  ROBODOJO_GIT_MIRROR_DIR: ${{ vars.ROBODOJO_GIT_MIRROR_DIR }}
  ROBODOJO_CUROBO_VERSION: ${{ vars.ROBODOJO_CUROBO_VERSION }}
  ROBODOJO_HF_ENDPOINT: ${{ vars.ROBODOJO_HF_ENDPOINT }}
  # Persistent results dir on the runner (outside the job workspace, which is wiped).
  ROBODOJO_OUTPUT_DIR: ${{ vars.ROBODOJO_OUTPUT_DIR }}

jobs:
  start-client:
    name: Start eval client (background)
    runs-on: [self-hosted, linux, a100]
    timeout-minutes: 180
    outputs:
      tasks: ${{ steps.resolve.outputs.tasks }}
    env:
      POLICY_NAME: ${{ inputs.policy_name }}
      POLICY_HOST: ${{ inputs.policy_host }}
      POLICY_PORT: ${{ inputs.policy_port }}
      CKPT: ${{ inputs.ckpt }}
      EVAL_NUM: ${{ inputs.eval_num }}
      ACTION_TYPE: ${{ inputs.action_type }}
      ENV_CFG: ${{ inputs.env_cfg || vars.ROBODOJO_ENV_CFG || 'arx_x5' }}
      SEED: ${{ inputs.seed }}
      ENV_GPU: ${{ inputs.env_gpu || vars.ROBODOJO_ENV_GPU || '0' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 6
        with:
          submodules: false
          lfs: false

      - name: Checkout fallback (API tarball)
        if: steps.checkout.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # The repo is not on disk yet, so this logic must stay inline.
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          api() {
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 \
              -H "Authorization: Bearer ${GH_TOKEN}" "$@"
          }
          api "https://api.github.com/repos/${REPO}/tarball/${SHA}" | tar -xz --strip-components=1
          # Submodule gitlinks in ls-tree format, for `robodojo_ci.sh fetch-submodules`.
          api "https://api.github.com/repos/${REPO}/git/trees/${SHA}?recursive=1" \
            | jq -r '.tree[] | select(.type == "commit") | "160000 commit \(.sha)\t\(.path)"' \
            > .ci_submodules
          cat .ci_submodules

      - name: Fetch submodules (local mirrors first)
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: bash scripts/ci/robodojo_ci.sh fetch-submodules

      - name: Validate inputs and resolve tasks
        id: resolve
        run: python3 scripts/ci/resolve_eval_inputs.py

      - name: Check for already-running client(s)
        id: existing
        env:
          TASKS_JSON: ${{ steps.resolve.outputs.tasks }}
        run: |
          set -euo pipefail
          all_running=true
          for TASK in $(jq -r '.[]' <<< "${TASKS_JSON}"); do
            name="robodojo-client-${POLICY_NAME}-${TASK}"
            state="$(docker inspect -f '{{.State.Status}}' "${name}" 2>/dev/null || true)"
            if [[ "${state}" == "running" ]]; then
              TASK="${TASK}" ROBODOJO_CONTAINER_NAME="${name}" bash scripts/ci/robodojo_ci.sh client-status
              echo "- \`${name}\` already running (started $(docker inspect -f '{{.State.StartedAt}}' "${name}"))" >> "${GITHUB_STEP_SUMMARY}"
            else
              all_running=false
            fi
          done
          echo "all_running=${all_running}" >> "${GITHUB_OUTPUT}"
          if [[ "${all_running}" == "true" ]]; then
            echo "::notice::All requested eval clients are already running; nothing to start."
          fi

      - name: Check policy adapter exists
        if: steps.existing.outputs.all_running != 'true'
        run: |
          test -f "XPolicyLab/policy/${INPUT_POLICY_NAME}/deploy.py" || {
            echo "::error::XPolicyLab/policy/${INPUT_POLICY_NAME}/deploy.py not found"; exit 1; }

      - name: Check GPU (host + container)
        if: steps.existing.outputs.all_running != 'true'
        run: bash scripts/ci/robodojo_ci.sh check-gpu

      - name: Ensure client image (cached unless rebuild_image)
        if: steps.existing.outputs.all_running != 'true'
        env:
          ROBODOJO_REBUILD_IMAGE: ${{ inputs.rebuild_image }}
        run: bash scripts/ci/robodojo_ci.sh ensure-image

      - name: Ensure assets (cached; download only if missing)
        if: steps.existing.outputs.all_running != 'true'
        run: bash scripts/ci/robodojo_ci.sh ensure-assets

      - name: Check assets
        if: steps.existing.outputs.all_running != 'true'
        run: bash scripts/ci/robodojo_ci.sh check-assets

      - name: Wait for policy server
        if: steps.existing.outputs.all_running != 'true'
        run: bash scripts/ci/robodojo_ci.sh wait-server

      - name: Start client container(s) in background
        if: steps.existing.outputs.all_running != 'true'
        env:
          TASKS_JSON: ${{ steps.resolve.outputs.tasks }}
          RUN_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${ROBODOJO_OUTPUT_DIR:=${HOME}/robodojo-eval_result}"
          export ROBODOJO_OUTPUT_DIR
          {
            echo "## RoboDojo eval client"
            echo
            echo "| Task | Container | Status |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"
          for TASK in $(jq -r '.[]' <<< "${TASKS_JSON}"); do
            export TASK
            export ROBODOJO_CONTAINER_NAME="robodojo-client-${POLICY_NAME}-${TASK}"
            export ROBODOJO_RUN_ID="${RUN_TAG}"
            before="$(docker inspect -f '{{.State.Status}}' "${ROBODOJO_CONTAINER_NAME}" 2>/dev/null || true)"
            bash scripts/ci/robodojo_ci.sh start-client
            if [[ "${before}" == "running" ]]; then status="already running"; else status="started"; fi
            echo "| ${TASK} | \`${ROBODOJO_CONTAINER_NAME}\` | ${status} |" >> "${GITHUB_STEP_SUMMARY}"
          done
          {
            echo
            echo "Results: \`${ROBODOJO_OUTPUT_DIR}\` on runner \`${RUNNER_NAME}\`."
            echo "Follow: \`docker logs -f <container>\` · Status: \`TASK=<task> ROBODOJO_CONTAINER_NAME=<container> bash scripts/ci/robodojo_ci.sh client-status\`"
          } >> "${GITHUB_STEP_SUMMARY}"
